note: '16-cell load ladder. Data channels from the x86 ladder set (68000+ PUSCH 4L
  MCS27, 68100+ PDSCH 4L MCS27), control channels moderate (PUCCH default F1 2bit
  x4, PRACH B4 1 occasion, SRS 4UE 1port 1sym) so that the data channels bind first;
  *_ctlmax variants put PUCCH/PRACH/SRS at their c8_max TVs. Non-64C build: <=128
  PDSCH UEs and <=128 PUSCH TBs per cell group -> 8 UE x 16 cells is the limit (68105
  16 UE excluded).'
